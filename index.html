<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tommis Pictures</title>

    <link rel="icon" href="https://i.imgur.com/YFk1Xr9.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --background: #050505;
            --panel: rgba(20, 20, 20, 0.78);
            --border: rgba(255, 255, 255, 0.10);
            --text: #ffffff;
            --muted: #9b9b9b;
            --accent: #ffffff;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* ---------- Background ---------- */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -2;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(255, 255, 255, 0.055),
                    transparent 38%
                ),
                #050505;
        }

        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px
                );
            background-size: 80px 80px;
            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 85%
            );
        }

        /* ---------- Login ---------- */

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-container {
            width: min(430px, 100%);
            text-align: center;

            animation:
                pageEnter 0.9s cubic-bezier(.16,1,.3,1)
                both;
        }

        .logo {
            width: 210px;
            max-width: 70%;
            height: auto;
            margin-bottom: 38px;

            filter:
                drop-shadow(0 12px 35px rgba(0,0,0,0.65));

            animation:
                logoEnter 1s cubic-bezier(.16,1,.3,1)
                both;
        }

        .login-card {
            padding: 34px;
            border: 1px solid var(--border);
            border-radius: 18px;

            background: var(--panel);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.04);

            transition:
                transform 0.35s ease,
                border-color 0.35s ease,
                box-shadow 0.35s ease;
        }

        .login-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(255,255,255,0.16);

            box-shadow:
                0 35px 90px rgba(0,0,0,0.65),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 25px;
            font-weight: 600;
            letter-spacing: -0.4px;
            margin-bottom: 9px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* ---------- Inputs ---------- */

        .field {
            position: relative;
            margin-bottom: 14px;
        }

        input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 11px;

            outline: none;

            background: rgba(255,255,255,0.055);
            color: white;

            font-size: 15px;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        input::placeholder {
            color: #777;
        }

        input:focus {
            border-color:
                rgba(255,255,255,0.35);

            background:
                rgba(255,255,255,0.075);

            box-shadow:
                0 0 0 4px rgba(255,255,255,0.035);
        }

        /* ---------- Button ---------- */

        .login-button {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;
            border-radius: 11px;

            background: #ffffff;
            color: #050505;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 30px rgba(255,255,255,0.12);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button.loading {
            pointer-events: none;
            opacity: 0.65;
        }

        /* ---------- Messages ---------- */

        .message {
            min-height: 20px;
            margin-top: 17px;

            font-size: 13px;
            line-height: 1.4;

            color: #a5a5a5;

            opacity: 0;
            transform: translateY(-4px);

            transition:
                opacity 0.25s ease,
                transform 0.25s ease;
        }

        .message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ---------- Footer ---------- */

        .footer {
            margin-top: 24px;

            color: #555;
            font-size: 12px;
        }

        /* ---------- Animations ---------- */

        @keyframes pageEnter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes logoEnter {
            from {
                opacity: 0;
                transform: translateY(-15px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ---------- Mobile ---------- */

        @media (max-width: 500px) {

            .page {
                padding: 20px;
            }

            .login-card {
                padding: 27px 21px;
                border-radius: 15px;
            }

            .logo {
                width: 175px;
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <main class="page">

        <section class="login-container">

            <img
                class="logo"
                src="https://i.imgur.com/YFk1Xr9.png"
                alt="Tommis Pictures"
            >

            <div class="login-card">

                <h1>Welcome back</h1>

                <p class="subtitle">
                    Sign in to continue to Tommis Pictures.
                </p>

                <form id="loginForm">

                    <div class="field">
                        <input
                            id="email"
                            type="email"
                            placeholder="Email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="field">
                        <input
                            id="password"
                            type="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        id="loginButton"
                        class="login-button"
                        type="submit"
                    >
                        Sign in
                    </button>

                </form>

                <div id="message" class="message"></div>

            </div>

            <div class="footer">
                Tommis Pictures
            </div>

        </section>

    </main>

    <script type="module">

        import {
            createClient
        } from "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://pyzlmehyxajxpkpsrtkv.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_CA0HNiZaQfpBno0-vLmtSw_Kv97V1b9";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");

        function showMessage(text) {
            message.textContent = text;
            message.classList.add("visible");
        }

        loginForm.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            loginButton.classList.add("loading");
            loginButton.textContent = "Signing in…";

            message.classList.remove("visible");

            const { error } =
                await supabase.auth.signInWithPassword({
                    email,
                    password
                });

            if (error) {

                showMessage(
                    "Incorrect email or password."
                );

                loginButton.classList.remove("loading");
                loginButton.textContent = "Sign in";

                return;
            }

            showMessage("Signed in successfully.");

            setTimeout(() => {

                window.location.href = "home.html";

            }, 700);

        });

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tommis Pictures</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/YFk1Xr9.png">

  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(80, 80, 80, 0.22),
          transparent 45%
        ),
        radial-gradient(
          circle at 10% 40%,
          rgba(40, 40, 40, 0.15),
          transparent 40%
        ),
        #050505;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.018) 1px,
          transparent 1px
        );

      background-size: 45px 45px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 75%
        );
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 82px;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 42px;

      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(5, 5, 5, 0.72);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
      width: 170px;
      height: auto;
      display: block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .welcome {
      color: rgba(255,255,255,0.58);
      font-size: 14px;
    }

    .logout {
      border: 1px solid rgba(255,255,255,0.13);

      background: rgba(255,255,255,0.055);

      color: white;

      padding: 10px 16px;

      border-radius: 9px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .logout:hover {
      background: rgba(255,255,255,0.11);

      border-color:
        rgba(255,255,255,0.24);

      transform:
        translateY(-1px);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1400px;

      margin: 0 auto;

      padding:
        75px
        42px
        40px;
    }

    .hero-small {
      color: rgba(255,255,255,0.5);

      text-transform: uppercase;

      letter-spacing: 3px;

      font-size: 12px;

      margin-bottom: 15px;
    }

    .hero h1 {
      margin: 0;

      font-size:
        clamp(38px, 5vw, 68px);

      letter-spacing: -2px;

      line-height: 1;

      font-weight: 700;
    }

    .hero p {
      max-width: 620px;

      margin-top: 22px;

      color:
        rgba(255,255,255,0.55);

      font-size: 16px;

      line-height: 1.7;
    }

    /* =========================
       MOVIES
    ========================= */

    .movies-section {
      max-width: 1400px;

      margin: 0 auto;

      padding:
        30px
        42px
        100px;
    }

    .section-title {
      font-size: 21px;

      font-weight: 600;

      margin-bottom: 22px;
    }

    .movie-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 26px;
    }

    .movie-card {
      position: relative;

      min-height: 310px;

      border-radius: 16px;

      overflow: hidden;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #171717,
          #090909
        );

      border:
        1px solid
        rgba(255,255,255,0.07);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.35);

      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .movie-card:hover {
      transform:
        translateY(-6px)
        scale(1.008);

      border-color:
        rgba(255,255,255,0.18);

      box-shadow:
        0 28px 80px
        rgba(0,0,0,0.55);
    }

    .movie-poster {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.82;
      transform: scale(1.01);
      transition:
        transform 0.45s ease,
        opacity 0.3s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.055);
      opacity: 0.9;
    }

    .movie-card::before {
      content: "";

      position: absolute;

      inset: 0;
      z-index: 1;

      background:
        radial-gradient(
          circle at 75% 20%,
          rgba(255,255,255,0.08),
          transparent 35%
        ),
        linear-gradient(
          to bottom,
          transparent 35%,
          rgba(0,0,0,0.92) 100%
        );
    }

    .movie-content {
      position: absolute;

      left: 30px;
      right: 30px;
      bottom: 27px;

      z-index: 2;
    }

    .movie-title {
      font-size: 28px;

      font-weight: 650;

      margin-bottom: 8px;
    }

    .movie-description {
      max-width: 600px;

      color:
        rgba(255,255,255,0.57);

      font-size: 14px;

      line-height: 1.5;
    }

    .play-button {
      position: absolute;
      z-index: 3;

      right: 28px;
      bottom: 27px;

      width: 52px;
      height: 52px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: white;

      color: black;

      font-size: 18px;

      opacity: 0;

      transform: scale(0.8);

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .movie-card:hover .play-button {
      opacity: 1;

      transform: scale(1);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      padding: 80px 20px;

      text-align: center;

      color:
        rgba(255,255,255,0.4);
    }

    .spinner {
      width: 30px;
      height: 30px;

      margin:
        0 auto 16px;

      border:
        3px solid
        rgba(255,255,255,0.12);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       PLAYER
    ========================= */

    .player-overlay {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 35px;

      background:
        rgba(0,0,0,0.90);

      backdrop-filter: blur(12px);

      -webkit-backdrop-filter:
        blur(12px);
    }

    .player-overlay.active {
      display: flex;

      animation:
        fadeIn 0.25s ease;
    }

    .player-container {
      position: relative;

      width:
        min(1200px, 100%);

      background: #000;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 30px 120px
        rgba(0,0,0,0.75);

      animation:
        playerIn 0.3s ease;
    }

    mux-player {
      display: block;

      width: 100%;

      aspect-ratio: 16 / 9;
    }

    .close-player {
      position: absolute;

      top: 14px;
      right: 14px;

      z-index: 20;

      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(0,0,0,0.7);

      color: white;

      font-size: 20px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease;
    }

    .close-player:hover {
      background:
        rgba(255,255,255,0.18);

      transform:
        rotate(90deg);
    }

    .player-loading {
      position: absolute;

      inset: 0;

      z-index: 5;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background: #000;

      color:
        rgba(255,255,255,0.6);

      pointer-events: none;
    }

    .player-loading.active {
      display: flex;
    }

    .player-spinner {
      width: 38px;
      height: 38px;

      margin-bottom: 16px;

      border:
        3px solid
        rgba(255,255,255,0.15);

      border-top-color: white;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    .player-error {
      position: absolute;

      inset: 0;

      z-index: 6;

      display: none;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      padding: 30px;

      background: #000;

      text-align: center;
    }

    .player-error.active {
      display: flex;
    }

    .player-error-title {
      font-size: 21px;

      font-weight: 600;

      margin-bottom: 10px;
    }

    .player-error-text {
      max-width: 500px;

      color:
        rgba(255,255,255,0.5);

      line-height: 1.6;

      font-size: 14px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes playerIn {
      from {
        opacity: 0;

        transform:
          scale(0.96)
          translateY(12px);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          translateY(0);
      }
    }

    /* =========================
       GENERAL ERROR
    ========================= */

    .error {
      display: none;

      margin:
        30px auto;

      max-width: 700px;

      padding:
        18px 20px;

      border:
        1px solid
        rgba(255,80,80,0.2);

      border-radius: 10px;

      background:
        rgba(255,50,50,0.06);

      color:
        rgba(255,180,180,0.9);

      text-align: center;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 0 20px;

        height: 70px;
      }

      .logo {
        width: 135px;
      }

      .welcome {
        display: none;
      }

      .hero {
        padding:
          55px
          22px
          25px;
      }

      .movies-section {
        padding:
          25px
          22px
          70px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
      }

      .movie-card {
        min-height: 280px;
      }

      .play-button {
        opacity: 1;

        transform: scale(1);
      }

      .player-overlay {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <img
      class="logo"
      src="https://i.imgur.com/YFk1Xr9.png"
      alt="Tommis Pictures"
    >

    <div class="header-right">

      <span
        class="welcome"
        id="welcomeText"
      >
        Welcome
      </span>

      <button
        class="logout"
        id="logoutButton"
      >
        Log out
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main>

    <section class="hero">

      <div class="hero-small">
        TOMMIS PICTURES
      </div>

      <h1>
        Your collection.
      </h1>

      <p>
        Welcome to your private Tommis Pictures
        library. Select a movie below to start
        watching.
      </p>

    </section>


    <section class="movies-section">

      <div class="section-title">
        Movies
      </div>

      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        Loading your movies...

      </div>

      <div
        id="movieGrid"
        class="movie-grid"
      ></div>

      <div
        id="error"
        class="error"
      ></div>

    </section>

  </main>


  <!-- =========================
       PLAYER MODAL
  ========================= -->

  <div
    id="playerOverlay"
    class="player-overlay"
  >

    <div class="player-container">

      <button
        class="close-player"
        id="closePlayer"
        aria-label="Close player"
      >
        ×
      </button>


      <div
        id="playerLoading"
        class="player-loading"
      >

        <div class="player-spinner"></div>

        <div>
          Preparing movie...
        </div>

      </div>


      <div
        id="playerError"
        class="player-error"
      >

        <div class="player-error-title">
          Unable to play this movie
        </div>

        <div
          id="playerErrorText"
          class="player-error-text"
        >
          Something went wrong while preparing
          the video.
        </div>

      </div>


      <mux-player
        id="muxPlayer"
        controls
        playsinline
      ></mux-player>

    </div>

  </div>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://pyzlmehyxajxpkpsrtkv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_CA0HNiZaQfpBno0-vLmtSw_Kv97V1b9";


    /* =========================
       MOVIE THUMBNAILS
    ========================= */

    const MOVIE_THUMBNAILS = [
      "https://i.imgur.com/yKmaze5.jpg",
      "https://i.imgur.com/S8zTESb.jpg"
    ];


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       ELEMENTS
    ========================= */

    const loading =
      document.getElementById(
        "loading"
      );

    const movieGrid =
      document.getElementById(
        "movieGrid"
      );

    const errorBox =
      document.getElementById(
        "error"
      );

    const welcomeText =
      document.getElementById(
        "welcomeText"
      );

    const logoutButton =
      document.getElementById(
        "logoutButton"
      );

    const playerOverlay =
      document.getElementById(
        "playerOverlay"
      );

    const closePlayer =
      document.getElementById(
        "closePlayer"
      );

    const muxPlayer =
      document.getElementById(
        "muxPlayer"
      );

    const playerLoading =
      document.getElementById(
        "playerLoading"
      );

    const playerError =
      document.getElementById(
        "playerError"
      );

    const playerErrorText =
      document.getElementById(
        "playerErrorText"
      );


    /* =========================
       AUTH CHECK
    ========================= */

    const {
      data: {
        session
      }
    } =
      await supabase.auth.getSession();


    if (!session) {

      window.location.href =
        "index.html";

    } else {

      const email =
        session.user.email ||
        "Member";

      welcomeText.textContent =
        `Welcome, ${email}`;

      loadMovies();
    }


    /* =========================
       LOGOUT
    ========================= */

    logoutButton.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        window.location.href =
          "index.html";

      }
    );


    /* =========================
       MUX TOKENS
    ========================= */

    async function getMuxTokens(playbackId) {

      const {
        data: {
          session: currentSession
        }
      } = await supabase.auth.getSession();

      if (!currentSession) {
        window.location.href = "index.html";
        return null;
      }

      const {
        data: functionData,
        error: functionError
      } = await supabase.functions.invoke(
        "get-mux-token",
        {
          body: {
            playbackId: playbackId
          },
          headers: {
            Authorization:
              `Bearer ${currentSession.access_token}`
          }
        }
      );

      if (functionError) {
        throw functionError;
      }

      if (!functionData || !functionData.token) {
        throw new Error(
          "The Mux token function did not return a playback token."
        );
      }

      return functionData;
    }


    /* =========================
       LOAD MOVIES
    ========================= */

    async function loadMovies() {

      loading.style.display =
        "block";

      errorBox.style.display =
        "none";


      const {
        data,
        error
      } =
        await supabase
          .from("movies")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      loading.style.display =
        "none";


      if (error) {

        console.error(
          "Movie loading error:",
          error
        );

        errorBox.textContent =
          "Could not load your movie library.";

        errorBox.style.display =
          "block";

        return;
      }


      movieGrid.innerHTML = "";


      if (
        !data ||
        data.length === 0
      ) {

        errorBox.textContent =
          "No movies have been added yet.";

        errorBox.style.display =
          "block";

        return;
      }


      data.forEach(
        (movie, index) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "movie-card";

          card.innerHTML = `

            <img
              class="movie-poster"
              src="${MOVIE_THUMBNAILS[index] || ""}"
              alt=""
              loading="lazy"
            >

            <div class="movie-content">

                <div class="movie-title">
                ${escapeHtml(movie.title)}
              </div>

              <div class="movie-description">
                ${escapeHtml(
                  movie.description ||
                  "Ready to watch."
                )}
              </div>

            </div>

            <div class="play-button">
              ▶
            </div>

          `;

          card.addEventListener(
            "click",
            () => openMovie(movie)
          );

          movieGrid.appendChild(
            card
          );

        }
      );
    }


    /* =========================
       OPEN MOVIE
    ========================= */

    async function openMovie(movie) {

      playerOverlay.classList.add(
        "active"
      );

      playerLoading.classList.add(
        "active"
      );

      playerError.classList.remove(
        "active"
      );


      try {

        const playbackId =
          movie.video_path;


        if (!playbackId) {

          throw new Error(
            "This movie does not have a Mux playback ID."
          );

        }


        console.log(
          "Requesting Mux token..."
        );

        const functionData =
          await getMuxTokens(playbackId);

        if (!functionData) {
          return;
        }

        console.log(
          "Mux token response received."
        );


        /*
          Clear the previous player.
        */

        muxPlayer.pause();

        muxPlayer.removeAttribute(
          "playback-id"
        );


        /*
          Give Mux Player the signed tokens
          BEFORE setting the playback ID.

          Setting playback-id starts the media
          source setup. On the first opening,
          especially on mobile Safari, the player
          can begin that setup before a token
          assigned afterward is available.
        */

        muxPlayer.tokens = {

          playback:
            functionData.token,

          thumbnail:
            functionData.thumbnailToken

        };


        /*
          Now set the new signed playback.
        */

        muxPlayer.setAttribute(
          "playback-id",
          playbackId
        );


        /*
          Tell the player to load
          the new movie.
        */

        muxPlayer.load();


        console.log(
          "Mux Player loading movie..."
        );


      } catch (err) {

        console.error(
          "Movie playback error:",
          err
        );


        playerLoading.classList.remove(
          "active"
        );


        playerErrorText.textContent =
          err?.message ||
          "Something went wrong while preparing the video.";


        playerError.classList.add(
          "active"
        );


        return;
      }

    }


    /* =========================
       PLAYER EVENTS
    ========================= */

    muxPlayer.addEventListener(
      "loadstart",
      () => {

        playerLoading.classList.add(
          "active"
        );

      }
    );


    muxPlayer.addEventListener(
      "canplay",
      () => {

        playerLoading.classList.remove(
          "active"
        );

      }
    );


    muxPlayer.addEventListener(
      "playing",
      () => {

        playerLoading.classList.remove(
          "active"
        );

        playerError.classList.remove(
          "active"
        );

      }
    );


    muxPlayer.addEventListener(
      "error",
      (event) => {

        console.error(
          "Mux Player error:",
          event
        );

        playerLoading.classList.remove(
          "active"
        );

      }
    );


    /* =========================
       CLOSE PLAYER
    ========================= */

    function closeMovie() {

      try {

        muxPlayer.pause();

      } catch {}


      muxPlayer.removeAttribute(
        "playback-id"
      );


      playerLoading.classList.remove(
        "active"
      );


      playerError.classList.remove(
        "active"
      );


      playerOverlay.classList.remove(
        "active"
      );

    }


    closePlayer.addEventListener(
      "click",
      closeMovie
    );


    playerOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          playerOverlay
        ) {

          closeMovie();

        }

      }
    );


    document.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Escape" &&
          playerOverlay.classList.contains(
            "active"
          )
        ) {

          closeMovie();

        }

      }
    );


    /* =========================
       HTML ESCAPING
    ========================= */

    function escapeHtml(value) {

      return String(value)

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );

    }

  </script>

</body>
</html>

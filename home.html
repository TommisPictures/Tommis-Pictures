<script type="module">

  import {
    createClient
  } from "https://esm.sh/@supabase/supabase-js@2";


  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://pyzlmehyxajxpkpsrtkv.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CA0HNiZaQfpBno0-vLmtSw_Kv97V1b9";


  const supabase =
    createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     CUSTOM MOVIE THUMBNAILS
  ========================= */

  const MOVIE_THUMBNAILS = [
    "https://i.imgur.com/yKmaze5.jpg",
    "https://i.imgur.com/S8zTESb.jpg"
  ];


  /* =========================
     ELEMENTS
  ========================= */

  const loading =
    document.getElementById(
      "loading"
    );

  const movieGrid =
    document.getElementById(
      "movieGrid"
    );

  const errorBox =
    document.getElementById(
      "error"
    );

  const welcomeText =
    document.getElementById(
      "welcomeText"
    );

  const logoutButton =
    document.getElementById(
      "logoutButton"
    );

  const playerOverlay =
    document.getElementById(
      "playerOverlay"
    );

  const closePlayer =
    document.getElementById(
      "closePlayer"
    );

  const muxPlayer =
    document.getElementById(
      "muxPlayer"
    );

  const playerLoading =
    document.getElementById(
      "playerLoading"
    );

  const playerError =
    document.getElementById(
      "playerError"
    );

  const playerErrorText =
    document.getElementById(
      "playerErrorText"
    );


  /* =========================
     AUTH CHECK
  ========================= */

  const {
    data: {
      session
    }
  } =
    await supabase.auth.getSession();


  if (!session) {

    window.location.href =
      "index.html";

  } else {

    const email =
      session.user.email ||
      "Member";

    welcomeText.textContent =
      `Welcome, ${email}`;

    loadMovies();
  }


  /* =========================
     LOGOUT
  ========================= */

  logoutButton.addEventListener(
    "click",
    async () => {

      const { error: signOutError } =
        await supabase.auth.signOut({
          scope: "local"
        });

      if (signOutError) {

        console.error(
          "Logout error:",
          signOutError
        );

      }

      window.location.href =
        "index.html";

    }
  );


  /* =========================
     MUX TOKENS
  ========================= */

  async function getMuxTokens(playbackId) {

    const {
      data: {
        session: currentSession
      }
    } = await supabase.auth.getSession();

    if (!currentSession) {

      window.location.href =
        "index.html";

      return null;
    }

    const {
      data: functionData,
      error: functionError
    } = await supabase.functions.invoke(
      "get-mux-token",
      {
        body: {
          playbackId: playbackId
        },

        headers: {
          Authorization:
            `Bearer ${currentSession.access_token}`
        }
      }
    );

    if (functionError) {
      throw functionError;
    }

    if (
      !functionData ||
      !functionData.token
    ) {

      throw new Error(
        "The Mux token function did not return a playback token."
      );

    }

    return functionData;
  }


  /* =========================
     LOAD MOVIES
  ========================= */

  async function loadMovies() {

    loading.style.display =
      "block";

    errorBox.style.display =
      "none";


    const {
      data,
      error
    } =
      await supabase
        .from("movies")
        .select("*")
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    loading.style.display =
      "none";


    if (error) {

      console.error(
        "Movie loading error:",
        error
      );

      errorBox.textContent =
        "Could not load your movie library.";

      errorBox.style.display =
        "block";

      return;
    }


    movieGrid.innerHTML = "";


    if (
      !data ||
      data.length === 0
    ) {

      errorBox.textContent =
        "No movies have been added yet.";

      errorBox.style.display =
        "block";

      return;
    }


    data.forEach(
      (movie, index) => {

        const card =
          document.createElement(
            "div"
          );

        card.className =
          "movie-card";

        card.innerHTML = `

          <img
            class="movie-poster"
            alt=""
            loading="lazy"
          >

          <div class="movie-content">

            <div class="movie-title">
              ${escapeHtml(movie.title)}
            </div>

            <div class="movie-description">
              ${escapeHtml(
                movie.description ||
                "Ready to watch."
              )}
            </div>

          </div>

          <div class="play-button">
            ▶
          </div>

        `;


        const poster =
          card.querySelector(
            ".movie-poster"
          );


        /* =========================
           CUSTOM THUMBNAIL
        ========================= */

        if (poster) {

          poster.src =
            MOVIE_THUMBNAILS[index] ||
            "";

          poster.addEventListener(
            "error",
            () => poster.remove(),
            {
              once: true
            }
          );

        }


        /* =========================
           OPEN MOVIE
        ========================= */

        card.addEventListener(
          "click",
          () => openMovie(movie)
        );


        movieGrid.appendChild(
          card
        );

      }
    );

  }


  /* =========================
     OPEN MOVIE
  ========================= */

  async function openMovie(movie) {

    playerOverlay.classList.add(
      "active"
    );

    playerLoading.classList.add(
      "active"
    );

    playerError.classList.remove(
      "active"
    );


    try {

      const playbackId =
        movie.video_path;


      if (!playbackId) {

        throw new Error(
          "This movie does not have a Mux playback ID."
        );

      }


      console.log(
        "Requesting Mux token..."
      );


      const functionData =
        await getMuxTokens(
          playbackId
        );


      if (!functionData) {
        return;
      }


      console.log(
        "Mux token response received."
      );


      /*
        Clear the previous player.
      */

      muxPlayer.pause();

      muxPlayer.removeAttribute(
        "playback-id"
      );


      /*
        Set the new signed playback.
      */

      muxPlayer.setAttribute(
        "playback-id",
        playbackId
      );


      /*
        Give Mux Player the signed
        playback token.
      */

      muxPlayer.tokens = {

        playback:
          functionData.token,

        thumbnail:
          functionData.thumbnailToken

      };


      /*
        Tell the player to load
        the new movie.
      */

      muxPlayer.load();


      console.log(
        "Mux Player loading movie..."
      );


    } catch (err) {

      console.error(
        "Movie playback error:",
        err
      );


      playerLoading.classList.remove(
        "active"
      );


      playerErrorText.textContent =
        err?.message ||
        "Something went wrong while preparing the video.";


      playerError.classList.add(
        "active"
      );

    }

  }


  /* =========================
     PLAYER EVENTS
  ========================= */

  muxPlayer.addEventListener(
    "loadstart",
    () => {

      playerLoading.classList.add(
        "active"
      );

    }
  );


  muxPlayer.addEventListener(
    "canplay",
    () => {

      playerLoading.classList.remove(
        "active"
      );

    }
  );


  muxPlayer.addEventListener(
    "playing",
    () => {

      playerLoading.classList.remove(
        "active"
      );

      playerError.classList.remove(
        "active"
      );

    }
  );


  muxPlayer.addEventListener(
    "error",
    (event) => {

      console.error(
        "Mux Player error:",
        event
      );

      playerLoading.classList.remove(
        "active"
      );

    }
  );


  /* =========================
     CLOSE PLAYER
  ========================= */

  function closeMovie() {

    try {

      muxPlayer.pause();

    } catch {}


    muxPlayer.removeAttribute(
      "playback-id"
    );


    playerLoading.classList.remove(
      "active"
    );


    playerError.classList.remove(
      "active"
    );


    playerOverlay.classList.remove(
      "active"
    );

  }


  closePlayer.addEventListener(
    "click",
    closeMovie
  );


  playerOverlay.addEventListener(
    "click",
    (event) => {

      if (
        event.target ===
        playerOverlay
      ) {

        closeMovie();

      }

    }
  );


  document.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Escape" &&
        playerOverlay.classList.contains(
          "active"
        )
      ) {

        closeMovie();

      }

    }
  );


  /* =========================
     HTML ESCAPING
  ========================= */

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }

</script>
